name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q tests
      - name: Build package
        run: bash scripts/package.sh
      - name: Compile Bicep and check the committed ARM template is current
        run: |
          az bicep build --file infra/main.bicep --outfile /tmp/azuredeploy.json
          # Ignore 'metadata': it embeds the Bicep compiler version and a hash, which differ between machines.
          python - <<'PY'
          import json, sys
          fresh = json.load(open("/tmp/azuredeploy.json")); fresh.pop("metadata", None)
          committed = json.load(open("infra/azuredeploy.json")); committed.pop("metadata", None)
          if fresh != committed:
              sys.exit("infra/azuredeploy.json is out of date: run 'az bicep build --file infra/main.bicep --outfile infra/azuredeploy.json' and commit it")
          print("ARM template is current")
          PY
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/innerlogic-sentinel-connector.zip --generate-notes
