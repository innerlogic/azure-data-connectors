name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q tests
      - name: Build package
        run: bash scripts/package.sh
      - name: Compile Bicep and check the committed ARM template is current
        run: |
          az bicep build --file infra/main.bicep --outfile /tmp/azuredeploy.json
          diff <(python -m json.tool /tmp/azuredeploy.json) <(python -m json.tool infra/azuredeploy.json)
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/innerlogic-sentinel-connector.zip --generate-notes
